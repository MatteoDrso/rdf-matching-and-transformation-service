name: Build Service Image

# Build + publish the runtime service image (FastAPI + Karma JAR +
# OBOE ontology) to GitHub Container Registry. Consumed by:
#   - the nf-core module under nextflow/main.nf
#   - any other pipeline that wants to talk to the WP8 service
#
# Manual-only trigger (workflow_dispatch). Tag the release with a
# semantic version like `0.1.0`; the workflow publishes both
# `ghcr.io/<owner>/<repo>:vX.Y.Z` (immutable) and `:latest`
# (floating alias) so consumers can pin or follow the head.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version for this release (e.g. 0.1.0). Will be published as v<version> + :latest.'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase repo)
        id: img
        run: |
          repo="${{ github.repository }}"
          echo "name=ghcr.io/${repo,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # The Dockerfile defaults to KARMA_BUILD_STAGE=karma-from-url,
          # which downloads the published Karma JAR. That's exactly what
          # we want here too — no Maven build inside the service-image
          # workflow.
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:v${{ github.event.inputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
